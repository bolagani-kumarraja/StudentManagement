
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Search Student | StudentHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f5f7fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 18px 7%;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: #4f46e5;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-size: 14px;
            font-weight: 500;
        }

        nav a:hover,
        nav a.active {
            color: #4f46e5;
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }

        .search-card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 35px rgba(0,0,0,0.06);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            background: #e0e7ff;
            color: #4f46e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            margin-bottom: 22px;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px #e0e7ff;
        }

        .search-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-btn:hover {
            background: #4338ca;
        }

        .info-box {
            background: #eef2ff;
            color: #3730a3;
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.6;
            margin-top: 24px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        /* Footer */
        footer {
            background: #0f172a;
            color: #cbd5e1;
            padding: 22px;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            nav {
                gap: 12px;
            }

            .search-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="navbar">

            <a href="index.html" class="logo">
                🎓 StudentHub
            </a>

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="registration.html">Register</a>
                <a href="students">Students</a>
                <a href="search-student.html"
                   class="active">Search</a>
                <a href="update-student.html">Update</a>
                <a href="delete-student.html">Delete</a>
            </nav>

        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="search-card">

            <div class="icon-box" aria-hidden="true">
                🔍
            </div>

            <h1>Search Student</h1>

            <p class="subtitle">
                Find student information quickly
                using a unique Student ID.
            </p>

            <form action="search-student"
                  method="get">

                <label for="studentId">
                    Student ID
                </label>

                <input
                    type="number"
                    id="studentId"
                    name="id"
                    min="1"
                    step="1"
                    placeholder="Enter Student ID"
                    required
                >

                <button type="submit"
                        class="search-btn">
                    🔍 Search Student
                </button>

            </form>

            <div class="info-box">
                ℹ️ Enter a valid Student ID to view
                the student's details from the database.
            </div>

            <a href="students" class="back-link">
                ← Back to Student List
            </a>

        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>
            &copy; <span id="year">2026</span>
            StudentHub | Java-Servlet Web Application Project
        </p>
    </footer>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
