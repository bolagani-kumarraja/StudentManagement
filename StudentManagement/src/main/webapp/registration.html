<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Student | StudentHub</title>
<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
}

body {
	font-family: 'Segoe UI', Arial, sans-serif;
	background: #f5f7fb;
	color: #1e293b;
	min-height: 100vh;
	display: flex;
	flex-direction: column;
}

header {
	background: white;
	border-bottom: 1px solid #e2e8f0;
	padding: 18px 7%;
}

.navbar {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 20px;
	flex-wrap: wrap;
}

.logo {
	color: #4f46e5;
	font-size: 24px;
	font-weight: 800;
	text-decoration: none;
}

nav {
	display: flex;
	flex-wrap: wrap;
	gap: 22px;
}

nav a {
	text-decoration: none;
	color: #475569;
	font-size: 14px;
	font-weight: 500;
}

nav a:hover, nav a.active {
	color: #4f46e5;
}

main {
	flex: 1;
	display: flex;
	justify-content: center;
	align-items: center;
	padding: 50px 20px;
}

.registration-card {
	background: white;
	width: 100%;
	max-width: 650px;
	padding: 40px;
	border-radius: 16px;
	border: 1px solid #e2e8f0;
	box-shadow: 0 10px 35px rgba(0, 0, 0, .06);
}

.icon-box {
	width: 65px;
	height: 65px;
	border-radius: 50%;
	background: #e0e7ff;
	color: #4f46e5;
	display: flex;
	align-items: center;
	justify-content: center;
	margin: 0 auto 20px;
	font-size: 28px;
}

h1 {
	text-align: center;
	font-size: 28px;
	margin-bottom: 10px;
}

.subtitle {
	text-align: center;
	color: #64748b;
	line-height: 1.6;
	margin-bottom: 30px;
}

.form-grid {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 20px;
}

.field {
	display: flex;
	flex-direction: column;
	gap: 8px;
	min-width: 0;
}

label {
	font-size: 14px;
	font-weight: 600;
}

input, select {
	width: 100%;
	padding: 13px 14px;
	border: 1px solid #cbd5e1;
	border-radius: 8px;
	font-size: 15px;
	font-family: inherit;
	background: white;
	color: #1e293b;
	outline: none;
}

input:focus, select:focus {
	border-color: #4f46e5;
	box-shadow: 0 0 0 3px #e0e7ff;
}

.info-box {
	margin: 25px 0;
	padding: 14px;
	background: #eef2ff;
	border-radius: 8px;
	color: #3730a3;
	font-size: 13px;
	line-height: 1.6;
}

.register-btn {
	width: 100%;
	padding: 15px;
	background: #4f46e5;
	border: none;
	border-radius: 8px;
	color: white;
	font-size: 15px;
	font-weight: 600;
	cursor: pointer;
	transition: background .2s;
}

.register-btn:hover {
	background: #4338ca;
}

.back-link {
	display: block;
	text-align: center;
	margin-top: 20px;
	color: #64748b;
	text-decoration: none;
	font-size: 14px;
}

.back-link:hover {
	color: #4f46e5;
}

footer {
	background: #0f172a;
	color: #cbd5e1;
	padding: 22px;
	text-align: center;
	font-size: 13px;
}

@media ( max-width : 600px) {
	header {
		padding: 18px 5%;
	}
	nav {
		gap: 12px;
	}
	.registration-card {
		padding: 25px 20px;
	}
	.form-grid {
		grid-template-columns: 1fr;
	}
}
</style>
</head>
<body>
	<header>
		<div class="navbar">
			<a href="index.html" class="logo">🎓 StudentHub</a>
			<nav aria-label="Main navigation">
				<a href="index.html">Home</a> <a href="registration.html"
					class="active">Register</a> <a href="students">Students</a> <a
					href="search-student.html">Search</a> <a href="update-student.html">Update</a>
				<a href="delete-student.html">Delete</a>
			</nav>
		</div>
	</header>
	<main>
		<section class="registration-card">
			<div class="icon-box" aria-hidden="true">🎓</div>
			<h1>Student Registration</h1>
			<p class="subtitle">Add a new student to the Student Management
				System.</p>
			<form action="register-student" method="post">
				<div class="form-grid">
					<div class="field">
						<label for="studentName">Student Name</label> <input type="text"
							id="studentName" name="studentName" minlength="2" maxlength="100"
							placeholder="Enter full name" autocomplete="name" required>
					</div>
					<div class="field">
						<label for="email">Email Address</label> <input type="email"
							id="email" name="email" maxlength="100"
							placeholder="student@example.com" autocomplete="email" required>
					</div>
					<div class="field">
						<label for="department">Department</label> <select id="department"
							name="department" required>
							<option value="" selected disabled>Select Department</option>
							<option value="CSE">CSE</option>
							<option value="ECE">ECE</option>
							<option value="EEE">EEE</option>
							<option value="IT">IT</option>
							<option value="Mechanical">Mechanical</option>
						</select>
					</div>
					<div class="field">
						<label for="year">Year of Study</label> <select id="year"
							name="year" required>
							<option value="" selected disabled>Select Year</option>
							<option value="1">First Year</option>
							<option value="2">Second Year</option>
							<option value="3">Third Year</option>
							<option value="4">Fourth Year</option>
						</select>
					</div>
				</div>
				<div class="info-box">ℹ️ Please enter accurate student
					information. All fields are required for registration.</div>
				<button type="submit" class="register-btn">Register Student</button>
			</form>
			<a href="students" class="back-link">View All Students</a>
		</section>
	</main>
	<footer>
		<p>
			&copy; <span id="footerYear">2026</span> StudentHub | Java-Servlet Web Application Project
		</p>
	</footer>
	<script>
    // Important: never target the Year of Study dropdown with this script.
    document.getElementById('footerYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
